<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>音を聞いて選ぶゲーム</title>
<style>
body{font-family:sans-serif;text-align:center;margin:0}
#choices{display:grid;gap:10px;margin:20px}
.choice{font-size:28px;padding:15px}
.top{display:flex;justify-content:center;gap:25px;font-size:20px;margin-top:10px}
#overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.8);
  color:white;display:none;flex-direction:column;
  justify-content:center;align-items:center;font-size:30px
}
.freeze{
  position:fixed;inset:0;background:rgba(0,0,0,.6);
  color:white;display:flex;justify-content:center;
  align-items:center;font-size:32px
}
</style>
</head>
<body>

<!-- スタート画面 -->
<div id="start">
  <h2>モード選択</h2>
  <button onclick="setMode('hira')">ひらがな</button>
  <button onclick="setMode('kata')">カタカナ</button>
  <h2>時間</h2>
  <button onclick="start(null)">制限なし</button>
  <button onclick="start(60)">1分</button>
  <button onclick="start(120)">2分</button>
</div>

<!-- ゲーム画面 -->
<div id="game" style="display:none;">
  <div class="top">
    <div>⏱ <span id="time">∞</span></div>
    <div>⭐ <span id="score">0</span></div>
    <div>🔥 <span id="streak">0</span></div>
  </div>
  <button onclick="play()">🔊 もう一度</button>
  <div id="choices"></div>
</div>

<!-- 終了画面 -->
<div id="overlay">
  <div>おわり！</div>
  <div>スコア: <span id="final"></span></div>
  <button onclick="location.reload()">もどる</button>
</div>

<script>
/* ===== データ ===== */
const data=[
["a","あ","ア"],["i","い","イ"],["u","う","ウ"],["e","え","エ"],["o","お","オ"],
["ka","か","カ"],["ki","き","キ"],["ku","く","ク"],["ke","け","ケ"],["ko","こ","コ"],
["sa","さ","サ"],["shi","し","シ"],["su","す","ス"],["se","せ","セ"],["so","そ","ソ"],
["ta","た","タ"],["chi","ち","チ"],["tsu","つ","ツ"],["te","て","テ"],["to","と","ト"],
["na","な","ナ"],["ni","に","ニ"],["nu","ぬ","ヌ"],["ne","ね","ネ"],["no","の","ノ"],
["ha","は","ハ"],["hi","ひ","ヒ"],["fu","ふ","フ"],["he","へ","ヘ"],["ho","ほ","ホ"],
["ma","ま","マ"],["mi","み","ミ"],["mu","む","ム"],["me","め","メ"],["mo","も","モ"],
["ya","や","ヤ"],["yu","ゆ","ユ"],["yo","よ","ヨ"],
["ra","ら","ラ"],["ri","り","リ"],["ru","る","ル"],["re","れ","レ"],["ro","ろ","ロ"],
["wa","わ","ワ"],["wo","を","ヲ"],["n","ん","ン"]
];

const sameSound=["o","wo"];

let mode="hira",list=[],answer=null;
let score=0,streak=0,miss=0,time=null,timer=null;
let audioCtx=null,audio=null,locked=false;

/* ===== モード ===== */
function setMode(m){
  mode=m;
  list=data.map(d=>({r:d[0],c:m==="hira"?d[1]:d[2]}));
}

/* ===== 開始 ===== */
function start(sec){
  document.getElementById("start").style.display="none";
  document.getElementById("game").style.display="block";
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  score=0;streak=0;miss=0;time=sec;
  update();next();play();
  if(sec){
    timer=setInterval(()=>{
      time--;update();
      if(time<=0) end();
    },1000);
  }
}

/* ===== 出題 ===== */
function next(){
  answer=list[Math.floor(Math.random()*list.length)];
  const pool=list.filter(o=>{
    if(!sameSound.includes(answer.r)) return true;
    return !sameSound.includes(o.r)||o.r===answer.r;
  });
  const count=level();
  const q=shuffle(pool).slice(0,count);
  if(!q.includes(answer)) q[0]=answer;
  shuffle(q);

  const area=document.getElementById("choices");
  area.innerHTML="";
  area.style.gridTemplateColumns=`repeat(${Math.min(count,3)},1fr)`;
  q.forEach(o=>{
    const b=document.createElement("button");
    b.className="choice";
    b.textContent=o.c;
    b.onclick=()=>check(o);
    area.appendChild(b);
  });
}

/* ===== レベル ===== */
function level(){
  if(streak>=6) return 9;
  if(streak>=3) return 6;
  return 4;
}

/* ===== 判定 ===== */
function check(o){
  if(locked) return;
  if(o===answer){
    score++;streak++;miss=0;
    new Audio("sounds/yeah.mp3").play();
    update();next();play();
  }else{
    streak=0;miss++;
    buzz();update();
    if(miss>=3) freeze();
  }
}

/* ===== フリーズ ===== */
function freeze(){
  locked=true;
  const f=document.createElement("div");
  f.className="freeze";
  f.innerText="Take your time";
  document.body.appendChild(f);
  setTimeout(()=>{locked=false;miss=0;f.remove()},2000);
}

/* ===== 音 ===== */
function play(){
  if(audio) audio.pause();
  audio=new Audio(`sounds/${answer.r}.m4a`);
  audio.play();
}
function buzz(){
  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  o.frequency.value=120;
  g.gain.value=.1;
  o.connect(g);g.connect(audioCtx.destination);
  o.start();o.stop(audioCtx.currentTime+.15);
}

/* ===== UI ===== */
function update(){
  document.getElementById("score").textContent=score;
  document.getElementById("streak").textContent=streak;
  document.getElementById("time").textContent=time??"∞";
}
function end(){
  clearInterval(timer);
  document.getElementById("final").textContent=score;
  document.getElementById("overlay").style.display="flex";
}
function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
</script>
</body>
</html>
